<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Gotitas — claustro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="gotitas.js" defer></script>
    <script src="projection.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand-mark" href="https://holaclaustro.com/" aria-label="Visitar el sitio de claustro">
          <img src="claustro-logo.png" alt="claustro" width="2031" height="455">
        </a>
        <div class="topbar-actions">
          <nav class="shader-tabs" aria-label="Shaders disponibles">
            <a href="fibonakis.html" aria-label="#003, Fibonakis"><span class="shader-tab-code">#003</span><span class="shader-tab-name" aria-hidden="true">fibonakis</span></a>
            <a href="gotitas.html" aria-current="page" aria-label="#002, Chispas"><span class="shader-tab-code">#002</span><span class="shader-tab-name" aria-hidden="true">chispas</span></a>
            <a href="curvas.html" aria-label="#001, Curvaturas"><span class="shader-tab-code">#001</span><span class="shader-tab-name" aria-hidden="true">curvaturas</span></a>
          </nav>
        </div>
      </header>

      <section class="workspace" aria-label="Preview y controles">
        <div class="visual-stack">
          <div class="stage">
            <div class="projection-zoom-controls" role="group" aria-label="Zoom del láser">
              <button id="previewZoomOut" type="button" aria-label="Alejar">-</button>
              <output id="previewZoomValue" aria-live="polite">100%</output>
              <button id="previewZoomIn" type="button" aria-label="Acercar">+</button>
              <button id="previewZoomReset" type="button" aria-label="Restablecer zoom" title="Restablecer zoom">↺</button>
            </div>
            <canvas id="preview" aria-label="Preview animado de estrellas de cuatro brazos"></canvas>
          </div>
          <div class="projection-grid">
            <section class="projection-view" aria-label="Vista volumétrica 3D">
              <div class="projection-zoom-controls" role="group" aria-label="Zoom de volumen 3D">
                <button id="projectionZoomOut" type="button" aria-label="Alejar">-</button>
                <output id="projectionZoomValue" aria-live="polite">100%</output>
                <button id="projectionZoomIn" type="button" aria-label="Acercar">+</button>
                <button id="projectionZoomReset" type="button" aria-label="Restablecer vista" title="Restablecer vista">↺</button>
              </div>
              <canvas id="projectionIso" aria-label="Vista volumétrica 3D de la proyección"></canvas>
              <div class="projection-surface-controls" role="group" aria-label="Superficie de la vista volumétrica">
                <button id="projectionGridMode" type="button" aria-label="Mostrar grilla" title="Grilla" aria-pressed="true">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="2.5" y="2.5" width="11" height="11" rx="1"></rect>
                    <path d="M6.2 2.5v11M9.8 2.5v11M2.5 6.2h11M2.5 9.8h11"></path>
                  </svg>
                </button>
                <button id="projectionSolidMode" type="button" aria-label="Mostrar suelo sólido" title="Suelo sólido" aria-pressed="false">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <rect class="solid-floor-icon" x="3" y="3" width="10" height="10" rx="1"></rect>
                  </svg>
                </button>
              </div>
            </section>
            <section class="projection-view" aria-label="Perfil de proyección">
              <canvas id="projectionProfile" aria-label="Perfil del cono de proyección"></canvas>
            </section>
          </div>
        </div>

        <aside class="panel">
          <details class="control-section" open>
            <summary>Proyección</summary>
          <label class="field">
            <span>Orientación</span>
            <select id="projectorOrientation">
              <option value="floor">Cenital · suelo</option>
              <option value="wall">Horizontal</option>
            </select>
          </label>
          </details>
          <details class="control-section">
            <summary>Bruma</summary>
          <label class="field">
            <span>Opacidad <output id="brumaAlphaValue">30%</output></span>
            <input id="brumaAlpha" type="range" min="1" max="30" step="0.1" value="30">
          </label>
          <label class="field">
            <span>Escala <output id="brumaScaleValue">1.00</output></span>
            <input id="brumaScale" type="range" min="0.25" max="3" step="0.05" value="1">
          </label>
          <label class="field">
            <span>Contraste <output id="brumaContrastValue">100%</output></span>
            <input id="brumaContrast" type="range" min="0" max="200" step="1" value="100">
          </label>
          </details>
          <details class="control-section">
            <summary>Estrellas</summary>
          <label class="field">
            <span>Cantidad <output id="countValue">6</output></span>
            <input id="count" type="range" min="1" max="12" step="1" value="6">
          </label>
          <label class="field">
            <span>Tamaño <output id="sizeValue">0.065</output></span>
            <input id="size" type="range" min="0.01" max="0.22" step="0.005" value="0.065">
          </label>
          <label class="field">
            <span>Variación de tamaño <output id="randomnessValue">0.18</output></span>
            <input id="randomness" type="range" min="0" max="0.7" step="0.01" value="0.18">
          </label>
          <label class="field">
            <span>Separación X <output id="spreadXValue">0.90</output></span>
            <input id="spreadX" type="range" min="0.2" max="1.2" step="0.01" value="0.9">
          </label>
          <label class="field">
            <span>Separación Y <output id="spreadYValue">0.82</output></span>
            <input id="spreadY" type="range" min="0.2" max="1.2" step="0.01" value="0.82">
          </label>
          <label class="field">
            <span>Jitter de celdas <output id="jitterValue">0.025</output></span>
            <input id="jitter" type="range" min="0" max="0.12" step="0.005" value="0.025">
          </label>
          <label class="field">
            <span>Semilla <output id="seedValue">11</output></span>
            <input id="seed" type="range" min="0" max="100" step="0.1" value="11">
          </label>
          </details>

          <details class="control-section">
            <summary>Secuencia</summary>
          <label class="field">
            <span>Duración <output id="durationValue">1.5 s</output></span>
            <input id="duration" type="range" min="0.1" max="10" step="0.1" value="1.5">
          </label>
          <label class="field">
            <span>Longitud de estela <output id="trailValue">0.35</output></span>
            <input id="trail" type="range" min="0.02" max="1" step="0.01" value="0.35">
          </label>
          <label class="field">
            <span>Desfase <output id="staggerValue">0.65</output></span>
            <input id="stagger" type="range" min="0" max="1" step="0.01" value="0.65">
          </label>
          <label class="field">
            <span>Velocidad <output id="speedValue">1.0</output></span>
            <input id="speed" type="range" min="0" max="5" step="0.1" value="1">
          </label>
          <label class="field">
            <span>Rotación <output id="rotationValue">90°</output></span>
            <input id="rotation" type="range" min="-360" max="360" step="1" value="90">
          </label>
          <label class="field">
            <span>Velocidad de rotación <output id="rotationSpeedValue">1.0</output></span>
            <input id="rotationSpeed" type="range" min="0" max="5" step="0.1" value="1">
          </label>
          <label class="field">
            <span>Suavidad de estela <output id="smoothnessValue">0.040</output></span>
            <input id="smoothness" type="range" min="0.001" max="0.25" step="0.001" value="0.04">
          </label>
          </details>

          <details class="control-section">
            <summary>Formación y barrido</summary>
          <label class="field">
            <span>Formación circular <output id="formationValue">0.00</output></span>
            <input id="formation" type="range" min="0" max="1" step="0.01" value="0">
          </label>
          <label class="field">
            <span>Radio del círculo <output id="radiusValue">0.65</output></span>
            <input id="radius" type="range" min="0.1" max="1.2" step="0.01" value="0.65">
          </label>
          <label class="field">
            <span>Rotación del círculo <output id="circleRotationValue">0°</output></span>
            <input id="circleRotation" type="range" min="-360" max="360" step="1" value="0">
          </label>
          <label class="field">
            <span>Barrido vertical <output id="sweepValue">1.00</output></span>
            <input id="sweep" type="range" min="0" max="1" step="0.01" value="1">
          </label>
          <label class="field">
            <span>Suavidad del barrido <output id="sweepSoftnessValue">0.060</output></span>
            <input id="sweepSoftness" type="range" min="0.001" max="0.25" step="0.001" value="0.06">
          </label>
          <label class="field">
            <span>Deriva <output id="driftValue">0.000</output></span>
            <input id="drift" type="range" min="0" max="0.08" step="0.001" value="0">
          </label>
          <label class="field">
            <span>Velocidad de deriva <output id="driftSpeedValue">1.0</output></span>
            <input id="driftSpeed" type="range" min="0" max="10" step="0.1" value="1">
          </label>
          </details>

          <details class="control-section">
            <summary>Color</summary>
          <label class="field">
            <span>Cantidad de colores</span>
            <select id="colorMode">
              <option value="0" selected>Un color</option>
              <option value="1">Dos colores</option>
            </select>
          </label>
          <label class="color-field">Color 1 <input id="color" type="color" value="#ffffff"></label>
          <label class="color-field" id="color2Group" hidden>Color 2 <input id="color2" type="color" value="#8b5cf6"></label>
          <label class="field">
            <span>Brillo <output id="brightnessValue">1.00</output></span>
            <input id="brightness" type="range" min="0" max="2" step="0.01" value="1">
          </label>
          </details>
        </aside>
      </section>

    </main>
  </body>
</html>
