name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Repositorio Github/preview/**"
      - "Repositorio Github/shaders/**"
      - "Repositorio Github/scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Regenerate shader bundle
        run: node scripts/build-shader-sources.mjs
        working-directory: Repositorio Github
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Repositorio Github/preview

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
